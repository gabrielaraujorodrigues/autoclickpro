name: Compilar APK Android

on:
  workflow_dispatch:
    inputs:
      mensagem:
        description: 'Motivo do build (opcional)'
        required: false
        default: 'Build manual'

jobs:
  build:
    name: Compilar AutoClickPro APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar pnpm
        run: npm install -g pnpm@10

      - name: Instalar dependencias
        run: pnpm install --no-frozen-lockfile

      - name: Gerar projeto nativo Android (Prebuild)
        working-directory: artifacts/mobile
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Compilar APK Debug
        working-directory: artifacts/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false'

      - name: Fazer upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoClickPro-APK
          path: artifacts/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Criar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "AutoClickPro v${{ github.run_number }}"
          body: |
            ## AutoClickPro - APK Pronto para Instalar

            **Como instalar no Android:**
            1. Baixe o arquivo `app-debug.apk` abaixo
            2. No celular: Configuracoes > Seguranca > Instalar apps desconhecidos > Ativar
            3. Abra o arquivo APK e instale

            Build: #${{ github.run_number }}
          files: artifacts/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
