name: Compilar APK Android

on:
  workflow_dispatch:
    inputs:
      mensagem:
        description: 'Motivo do build (opcional)'
        required: false
        default: 'Build manual'

jobs:
  build:
    name: Compilar AutoClickPro APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: pnpm install --no-frozen-lockfile
        env:
          HUSKY: '0'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Gerar projeto nativo Android (Prebuild)
        working-directory: artifacts/mobile
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Dar permissao ao Gradle
        working-directory: artifacts/mobile/android
        run: chmod +x gradlew

      - name: Compilar APK Debug
        working-directory: artifacts/mobile/android
        run: ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false'

      - name: Renomear APK
        run: |
          mkdir -p output
          cp artifacts/mobile/android/app/build/outputs/apk/debug/app-debug.apk output/AutoClickPro.apk

      - name: Fazer upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoClickPro-APK
          path: output/AutoClickPro.apk
          retention-days: 30

      - name: Criar Release automatica
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "AutoClickPro v1.0 (Build ${{ github.run_number }})"
          body: |
            ## AutoClickPro - APK Pronto para Instalar

            **Como instalar no Android:**
            1. Baixe o arquivo `AutoClickPro.apk` abaixo
            2. No celular, va em Configuracoes > Seguranca > Instalar apps desconhecidos
            3. Abra o arquivo APK e instale

            Build: #${{ github.run_number }}
          files: output/AutoClickPro.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
